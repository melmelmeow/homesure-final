<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../../assets/img/kasafide-favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16.png" />
  <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="../../site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../../assets/js/kasafide-theme.js"></script>
  <script src="../../assets/js/kasafide-logo.js"></script>
  <link rel="stylesheet" href="../../assets/css/kasafide-theme.css" />
  <title>Kasafide – Reviews & Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/skeleton.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
--radius: 12px;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }
    .layout { display: flex; min-height: 100vh; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .content { flex: 1; padding: 32px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* Page Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-sub {
      font-size: 14px;
      color: var(--muted);
    }

    /* Stats Overview */
    .stats-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .stat-number {
      font-size: 36px;
      font-weight: 900;
      color: var(--teal);
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .star-display {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin: 12px 0;
    }
    .star-display .star {
      font-size: 24px;
      color: var(--warning);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      color: var(--muted2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: rgb(var(--primary-rgb) / 0.3);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--on-primary);
    }

    /* Reviews List */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .review-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      transition: transform 0.2s;
    }
    .review-card:hover {
      transform: translateY(-2px);
      border-color: rgb(var(--primary-rgb) / 0.2);
    }
    .review-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .review-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .review-user-info {
      flex: 1;
    }
    .review-user-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .review-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .review-stars {
      display: flex;
      gap: 3px;
    }
    .review-stars .star {
      font-size: 16px;
      color: var(--warning);
    }
    .review-content {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .review-property {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--muted2);
      font-weight: 600;
    }

    /* Write Review Button */
    .btn-write-review {
      background: var(--teal);
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: var(--on-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgb(var(--primary-rgb) / 0.3);
    }
    .btn-write-review:hover {
      background: var(--primary);
      transform: translateY(-1px);
    }

    /* Write Review Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgb(var(--shade-rgb) / var(--overlay-a, 0.7));
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .modal-close {
      background: rgb(var(--wash-rgb) / 0.06);
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-body {
      padding: 24px;
      max-height: calc(90vh - 200px);
      overflow-y: auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted2);
      margin-bottom: 8px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--teal);
    }
    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }
    .star-rating {
      display: flex;
      gap: 8px;
      font-size: 32px;
      cursor: pointer;
    }
    .star-rating .star {
      color: rgb(var(--wash-rgb) / 0.2);
      transition: color 0.2s;
    }
    .star-rating .star.active,
    .star-rating .star:hover,
    .star-rating .star:hover ~ .star {
      color: var(--warning);
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-cancel {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted2);
    }
    .btn-submit {
      background: var(--teal);
      color: var(--on-primary);
    }
    .btn-submit:hover {
      background: var(--primary);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <div class="page-title">Reviews & Feedback</div>
          <div class="page-sub">See what renters are saying about properties and sellers</div>
        </div>
        <button class="btn-write-review" onclick="openReviewModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Write a Review
        </button>
      </div>

      <!-- Stats Overview -->
      <div class="stats-overview">
        <div class="stat-card">
          <div class="stat-number">4.8</div>
          <div class="star-display">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>
          <div class="stat-label">Average Rating</div>
        </div>

        <div class="stat-card">
          <div class="stat-number">142</div>
          <div class="stat-label">Total Reviews</div>
        </div>

        <div class="stat-card">
          <div class="stat-number">128</div>
          <div class="stat-label">5-Star Reviews</div>
        </div>

        <div class="stat-card">
          <div class="stat-number">98%</div>
          <div class="stat-label">Satisfaction Rate</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active">All Reviews</button>
        <button class="filter-btn">5 Stars</button>
        <button class="filter-btn">4 Stars</button>
        <button class="filter-btn">3 Stars</button>
        <button class="filter-btn">Recent</button>
        <button class="filter-btn">Verified Only</button>
      </div>

      <!-- Reviews List -->
      <div class="reviews-list" id="reviewsList">
        <!-- filled by buyer-reviews.js -->
      </div>

    </div>
  </div>
</div>

<!-- Write Review Modal -->
<div class="modal-backdrop" id="reviewModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Write a Review</div>
      <button class="modal-close" onclick="closeReviewModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="reviewForm">
        <div class="form-group">
          <label class="form-label">Property</label>
          <select class="form-input">
            <option>1-Bedroom Apartment near Town Proper</option>
            <option>Cozy Studio Apartment in Sonoma</option>
            <option>Modern 2BR Apartment</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Rating</label>
          <div class="star-rating" id="starRating">
            <span class="star" data-rating="5">★</span>
            <span class="star" data-rating="4">★</span>
            <span class="star" data-rating="3">★</span>
            <span class="star" data-rating="2">★</span>
            <span class="star" data-rating="1">★</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Your Review</label>
          <textarea class="form-textarea" placeholder="Share your experience with this property..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeReviewModal()">Cancel</button>
      <button class="btn btn-submit" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js?v=2"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
<script src="../../assets/js/buyer/buyer-reviews.js"></script>
</body>
</html>
