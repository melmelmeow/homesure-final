<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../../assets/img/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSure – Seller Help & Support Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Same issue as buyer/help.html: seller.css says "Requires: dashboard.css" in its own header
       comment, but this page never linked it, so every CSS variable and the base body font were
       undefined. seller-dashboard.css carries the same tokens seller.html itself uses. -->
  <link rel="stylesheet" href="../../assets/css/seller/seller-dashboard.css" />
  <link rel="stylesheet" href="../../assets/css/seller/seller.css" />
  <link rel="stylesheet" href="../../assets/css/chatbot-widget.css" />
  <link rel="stylesheet" href="../../assets/css/responsive.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1E293B; --card: #253347; --card2: #2c3d55; --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9; --muted: rgba(255, 255, 255, 0.45); --muted2: rgba(255, 255, 255, 0.7);
      --teal: #00c9a7; --teal-faint: rgba(0, 201, 167, 0.12); --teal-mid: rgba(0, 201, 167, 0.25);
      --radius: 14px;
    }
    [data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --card2: #f1f5f9; --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a; --muted: rgba(0, 0, 0, 0.5); --muted2: rgba(0, 0, 0, 0.7);
      --teal-faint: rgba(0, 201, 167, 0.10); --teal-mid: rgba(0, 201, 167, 0.20);
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    .layout { display: flex; height: 100vh; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .content { flex: 1; overflow-y: auto; padding: 26px 32px 60px; }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1fc8b4, #0a5e53); border-radius: 99px; }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 24px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .hero-search-card {
      background: linear-gradient(135deg, rgba(0, 201, 167, 0.15) 0%, rgba(37, 51, 71, 0.8) 100%);
      border: 1px solid var(--teal-mid); border-radius: var(--radius);
      padding: 24px 28px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 14px;
    }
    .hero-search-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .hero-search-sub { font-size: 13px; color: var(--muted2); line-height: 1.5; }
    .hero-search-input-wrap { position: relative; max-width: 600px; width: 100%; }
    .hero-search-input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .hero-search-input {
      width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 12px 16px 12px 42px; font-size: 13.5px; color: var(--text); font-family: inherit; outline: none; transition: all 0.2s;
    }
    .hero-search-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0, 201, 167, 0.15); }

    /* User Guides Grid */
    .guides-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 28px; }
    @media (max-width: 900px) { .guides-grid { grid-template-columns: 1fr; } }
    .guide-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px 22px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 10px;
    }
    .guide-card:hover { transform: translateY(-2px); border-color: var(--teal); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .guide-header { display: flex; align-items: center; gap: 12px; }
    .guide-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--teal-faint); color: var(--teal); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .guide-icon svg { width: 20px; height: 20px; }
    .guide-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .guide-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .guide-steps-list { display: none; margin-top: 10px; padding-left: 20px; font-size: 13px; color: var(--muted2); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 12px; }
    .guide-card.open .guide-steps-list { display: block; }
    .guide-card.open { border-color: var(--teal); }

    /* FAQ Section */
    .section-headline { font-size: 16px; font-weight: 800; color: var(--text); margin: 24px 0 14px; display: flex; align-items: center; justify-content: space-between; }
    .faq-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .faq-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .faq-card.open { border-color: var(--teal-mid); }
    .faq-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; }
    .faq-q { font-size: 13.5px; font-weight: 700; color: var(--text); }
    .faq-arrow { width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
    .faq-card.open .faq-arrow { transform: rotate(180deg); color: var(--teal); }
    .faq-answer { display: none; padding: 12px 20px 16px; font-size: 13px; color: var(--muted2); line-height: 1.6; border-top: 1px solid var(--border); }
    .faq-card.open .faq-answer { display: block; }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted2);
    }

    .chatbot-window {
      position: static !important;
      width: 100% !important;
      height: auto !important;
      flex: 1;
      min-height: 0;
      border-radius: 16px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1) !important;
      display: flex !important;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .chatbot-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, #00c9a7 0%, #0F766E 100%);
      padding: 20px 24px;
      border-bottom: none;
    }

    .chatbot-avatar {
      /* Was 20% opacity — same fix as the buyer version of this same page template: a
         teal-gradient logo needs real contrast against the teal header, not a faint tint. */
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .chatbot-avatar svg,
    .chatbot-avatar img {
      width: 36px;
      height: 36px;
      color: #fff;
      display: block;
    }

    .chatbot-header-info {
      flex: 1;
    }

    .chatbot-header-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .chatbot-header-status {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chatbot-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chatbot-messages {
      flex: 1 !important;
      min-height: 0 !important;
      overflow-y: auto !important;
      padding: 24px;
      background: var(--bg);
    }

    .chatbot-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chatbot-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chatbot-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    .chatbot-messages::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Message bubbles */
    .chat-message {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.bot .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-message.bot .message-avatar svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .chat-message.bot .message-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-top-left-radius: 4px;
      padding: 14px 18px;
      max-width: 70%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .chat-message.user {
      justify-content: flex-end;
    }

    .chat-message.user .message-bubble {
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      color: #fff;
      border-radius: 16px;
      border-top-right-radius: 4px;
      padding: 14px 18px;
      max-width: 70%;
      box-shadow: 0 2px 12px rgba(0, 201, 167, 0.3);
    }

    .message-text {
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .message-text:last-child {
      margin-bottom: 0;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .quick-action-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .quick-action-btn:hover {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      transform: translateY(-1px);
    }

    .chatbot-input-area {
      flex-shrink: 0;
      padding: 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    .chatbot-input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chatbot-input {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13.5px;
      color: var(--text);
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      max-height: 120px;
    }

    .chatbot-input:focus {
      border-color: var(--teal);
    }

    .chatbot-input::placeholder {
      color: var(--muted);
    }

    .chatbot-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c9a7, #0F766E);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chatbot-send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 201, 167, 0.4);
    }

    .chatbot-send-btn:active {
      transform: translateY(0);
    }

    .chatbot-send-btn svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    /* Same fix as buyer/help.html — no mobile handling existed at all, so the fixed mobile bottom
       nav (.hs-bottom-nav, sidebar.js, 62px tall) sat on top of the chat input. */
    @media (max-width: 768px) {
      .help-container {
        padding: 16px 14px;
        padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      }
      .page-header { margin-bottom: 14px; }
      .page-title { font-size: 19px; }
      .page-sub { font-size: 12px; }
      .chatbot-header { padding: 14px 16px; }
      .chatbot-avatar { width: 46px; height: 46px; }
      .chatbot-avatar svg, .chatbot-avatar img { width: 38px; height: 38px; }
      .chatbot-header-title { font-size: 15px; }
      .chatbot-messages { padding: 16px; }
      .chat-message .message-bubble,
      .chatbot-message-bubble { max-width: 85%; }
      .chatbot-input-area { padding: 12px; }
      .quick-actions { gap: 6px; }
      .quick-action-btn { padding: 6px 12px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="hs-sidebar"></div>
  <div class="main">
    <div id="hs-topbar"></div>
    <div class="content">

      <!-- ── PAGE HEADER ── -->
      <div class="page-header">
        <h1 class="page-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" width="26" height="26" style="color:var(--teal)">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Seller Help & Support Center
        </h1>
        <p class="page-sub">Find comprehensive seller user guides, title verification guidelines, and viewing management procedures.</p>
      </div>

      <!-- Chat Window (Full Page) -->
      <div class="chatbot-window open" id="chatbotWindow">
        <div class="chatbot-header">
          <div class="chatbot-avatar">
            <img src="../../assets/img/homesure-cat.svg" alt="Meowrie" />
          </div>
          <div class="chatbot-header-info">
            <div class="chatbot-header-title">Meowrie</div>
            <div class="chatbot-header-status">
              <span class="chatbot-status-dot"></span>
              Online - Always here to help
            </div>
          </div>
        </div>
      </div>

    </div><!-- /content -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../components/sidebar.js"></script>
<script src="../../components/customer-service.js"></script>
<script src="../../components/topbar.js"></script>
<script>
  HomeSureSidebar.init({ activePage: 'help' });
  HomeSureTopbar.init({ placeholder: 'Search help & user guides...' });

  function toggleGuide(card) {
    card.classList.toggle('open');
  }

  function toggleFaq(header) {
    const card = header.closest('.faq-card');
    card.classList.toggle('open');
  }

  function filterHelpContent(val) {
    const q = val.toLowerCase().trim();

    // Filter user guides
    document.querySelectorAll('.guide-card').forEach(card => {
      const kw = (card.dataset.keywords || '') + ' ' + card.innerText.toLowerCase();
      card.style.display = !q || kw.includes(q) ? 'flex' : 'none';
    });

    // Filter FAQs
    document.querySelectorAll('.faq-card').forEach(card => {
      const kw = (card.dataset.keywords || '') + ' ' + card.innerText.toLowerCase();
      card.style.display = !q || kw.includes(q) ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
